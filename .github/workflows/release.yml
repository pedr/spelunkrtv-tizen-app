name: Release

# Push a tag such as v1.2.0 to build Spelunkr.wgt and publish it as the only asset of a GitHub Release.
# The Apps2Samsung community catalog downloads that asset, so the release must have exactly one file.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the version in config.xml
        run: |
          version=$(sed -n 's/.*<widget[^>]* version="\([^"]*\)".*/\1/p' spelunkr-tv/config.xml)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in spelunkr-tv/config.xml"
            exit 1
          fi

      - name: Build Spelunkr.wgt
        run: scripts/build-wgt.sh

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Spelunkr.wgt --title "Spelunkr $GITHUB_REF_NAME" --generate-notes
